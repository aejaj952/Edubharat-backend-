<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBharat - Har Bhasha Me Shiksha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; }
        .card { background: #ffffff; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <div class="card space-y-4 text-center">
        <h1 class="text-2xl font-bold text-indigo-700">EduBharat 🇮🇳</h1>
        <p class="text-gray-600 text-sm">Har Bhasha Me Shiksha</p>

        <div class="p-4 bg-indigo-50 rounded-lg space-y-3">
            <h2 class="font-semibold text-gray-800">Teacher Voice Translator</h2>
            
            <button id="recordBtn" onclick="toggleRecording()" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-indigo-700 transition">
                🎙️ Start Recording (Mic)
            </button>

            <p class="text-xs text-gray-500">Or Choose Audio File (.mp3/.wav):</p>
            <input type="file" id="audioFileInput" accept="audio/*" onchange="handleFileUpload(event)" class="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:bg-indigo-100 file:text-indigo-700">
        </div>

        <div class="bg-gray-100 p-3 rounded-lg text-left text-xs font-mono">
            <p class="font-bold text-gray-700 mb-1">System Status:</p>
            <div id="statusLog" class="text-gray-600">Waiting for audio input...</div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        const statusLog = document.getElementById('statusLog');
        const recordBtn = document.getElementById('recordBtn');

        async function toggleRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result.split(',')[1];
                            statusLog.innerHTML = "✅ Base64 Ready!<br>⏳ Sending to Bhashini Server...";
                            sendToBackend(base64Audio);
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = "🛑 Stop Recording";
                    recordBtn.className = "w-full bg-red-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-red-700 transition";
                    statusLog.innerText = "Recording... Speak in Hindi now.";
                } catch (err) {
                    statusLog.innerHTML = "❌ Mic Access Denied or HTTP Blocked!";
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🎙️ Start Recording (Mic)";
                recordBtn.className = "w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-indigo-700 transition";
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = () => {
                    const base64Audio = reader.result.split(',')[1];
                    statusLog.innerHTML = "✅ Base64 Ready!<br>⏳ Sending to Bhashini Server...";
                    sendToBackend(base64Audio);
                };
            }
        }

        async function sendToBackend(base64Data) {
            try {
                const res = await fetch('https://edubharat-backend.onrender.com/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Data,
                        sourceLang: 'hi',
                        targetLang: 'sat' // Santali
                    })
                });

                const data = await res.json();

                if (data.translatedAudio) {
                    statusLog.innerHTML = "🔊 Playing Santali Translation...";
                    const translatedAudioPlayer = new Audio("data:audio/wav;base64," + data.translatedAudio);
                    translatedAudioPlayer.play();
                } else {
                    statusLog.innerHTML = "⚠️ Backend responded, but no audio received.";
                }
            } catch (e) {
                statusLog.innerHTML = "❌ Server error/offline. Please check backend.";
            }
        }
    </script>
</body>
</html>
